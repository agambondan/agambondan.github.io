name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint GitHub workflows
        uses: rhysd/actionlint@v1.7.1

  quality:
    needs: workflow-lint
    uses: ./.github/workflows/reusable-node-quality.yml

  security:
    needs: workflow-lint
    uses: ./.github/workflows/reusable-security.yml
